<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff6e8"><title>呼吸小氣球｜四寶遊戲樂園</title><style>
:root{color-scheme:light;--ink:#493634;--paper:#fff9ee;--red:#ad4942;--border:#e9d9c2}*{box-sizing:border-box}body{margin:0;background:#fbf4e7;color:var(--ink);font-family:system-ui,-apple-system,"Microsoft JhengHei",sans-serif}a{color:inherit}header{max-width:1160px;margin:auto;padding:20px 26px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{font-weight:900;color:#a44941;letter-spacing:.08em;font-size:15px}.brand span{display:inline-block;background:#a44941;color:white;border-radius:50%;width:30px;height:30px;line-height:30px;text-align:center;margin-right:8px;letter-spacing:0}.top-link{font-size:14px;font-weight:700;text-decoration:none;border-bottom:2px solid #ca7864;padding:4px}.hero{max-width:1110px;margin:8px auto 40px;min-height:330px;border-radius:26px;background:#f6d998;position:relative;overflow:hidden;display:flex;align-items:center;padding:45px 56px;box-shadow:0 8px 0 #eac58a}.hero:before,.hero:after{content:"";position:absolute;background:#fff6d8;opacity:.7;border-radius:50%}.hero:before{width:230px;height:230px;right:5%;top:-135px}.hero:after{width:400px;height:120px;right:-90px;bottom:-62px}.intro{z-index:1;max-width:520px}.eyebrow{font-size:13px;font-weight:900;letter-spacing:.2em;color:#a44a42}.hero h1{font-size:clamp(38px,6vw,64px);line-height:1.06;letter-spacing:.03em;margin:14px 0 12px;color:#7f3533}.hero p{font-size:16px;line-height:1.8;margin:0;color:#76544b}.hero a{display:inline-block;background:#a94b43;color:#fff;border-radius:999px;padding:12px 21px;text-decoration:none;font-weight:800;margin-top:21px;box-shadow:0 4px 0 #783a34}.characters{position:absolute;right:2%;bottom:12px;width:47%;height:210px;display:flex;align-items:end;justify-content:center;z-index:1}.characters img{width:26%;object-fit:contain;filter:drop-shadow(0 8px 0 #bd8b5730)}.characters img:nth-child(2){transform:translateY(-15px)}.characters img:nth-child(3){transform:translateY(4px)}.characters img:nth-child(4){transform:translateY(-10px)}main{max-width:1110px;margin:auto;padding:0 24px 65px}.section-header{display:flex;align-items:end;justify-content:space-between;gap:15px;border-bottom:2px solid #e6d5bb;padding-bottom:15px;margin-bottom:22px}.section-header h2{margin:0;font-size:27px;color:#703a37}.section-header p{margin:0;font-size:14px;color:#927568}.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}.filter{border:1px solid #dac5ad;background:#fffaf1;color:#755952;border-radius:999px;padding:8px 15px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}.filter[aria-pressed="true"]{background:#934a43;color:white;border-color:#934a43}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.game{display:flex;flex-direction:column;min-height:190px;background:#fffaf2;border:1px solid #eadbc8;border-radius:18px;overflow:hidden;text-decoration:none;transition:transform .15s,box-shadow .15s;box-shadow:0 3px 0 #e9d9c5}.game:hover,.game:focus-visible{transform:translateY(-3px);box-shadow:0 8px 0 #e9d9c5;outline-color:#a44941}.game[hidden]{display:none}.game-art{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 17px;background:var(--color);font-size:32px}.game-art small{font-size:11px;letter-spacing:.12em;font-weight:900;color:#704d49;background:#fff9;border-radius:30px;padding:5px 9px}.game-content{display:flex;flex-direction:column;gap:5px;padding:13px 17px 15px;flex:1}.game h3{font-size:18px;line-height:1.35;margin:0}.game p{font-size:13px;color:#8b7064;margin:0;line-height:1.55}.play{font-size:13px;font-weight:900;color:#a44941;margin-top:auto;padding-top:10px}.note{font-size:13px;color:#8c7569;margin:25px 0 0;line-height:1.7}footer{text-align:center;padding:20px 16px 35px;color:#9a8073;font-size:12px}@media(max-width:760px){header{padding:16px 20px}.hero{margin:4px 16px 34px;padding:30px 25px 165px;min-height:0}.hero h1{font-size:40px}.hero p{font-size:14px}.characters{width:78%;height:145px;right:4%;bottom:0}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}main{padding:0 16px 45px}.game{min-height:180px}.game-content{padding:12px}.game-art{padding:0 12px}.game h3{font-size:16px}.section-header{align-items:start;flex-direction:column;gap:5px}.section-header h2{font-size:24px}}@media(max-width:370px){.grid{grid-template-columns:1fr}.game{min-height:0}.game-art{height:54px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style></head><body><header><div class="brand"><span>DK</span>呼吸小氣球</div><a class="top-link" href="#games">探索遊戲 ↓</a></header><section class="hero"><div class="intro"><div class="eyebrow">LITTLE BALLOON · GAME PARK</div><h1>四寶遊戲樂園</h1><p>跟著 D、K、E、C 寶一起跑、跳、尋寶！<br>挑一款喜歡的遊戲，現在就出發。</p><a href="#games">來玩遊戲 →</a></div><div class="characters" aria-label="D、K、E、C 寶"><img src="assets/d.png" alt="D 寶"><img src="assets/k.png" alt="K 寶"><img src="assets/e.png" alt="E 寶"><img src="assets/c.png" alt="C 寶"></div></section><main id="games"><div class="section-header"><div><div class="eyebrow">PICK YOUR GAME</div><h2>今天想玩哪一個？</h2></div><p>選擇遊戲後即可開始挑戰</p></div><nav class="filters" aria-label="遊戲分類"><button class="filter" data-filter="all" aria-pressed="true">全部遊戲</button><button class="filter" data-filter="action" aria-pressed="false">跑跳挑戰</button><button class="filter" data-filter="puzzle" aria-pressed="false">動腦益智</button><button class="filter" data-filter="arcade" aria-pressed="false">歡樂遊戲</button></nav><div id="grid" class="grid"></div><p class="note">部分遊戲適合橫向遊玩；開啟後依遊戲畫面提示操作。</p></main><footer>呼吸小氣球 · 和四寶一起玩</footer><script>
const games=[
['雲端氣球跑酷','跑跳挑戰','在雲端左右換道，收集金幣！','☁️','#c9e7fa','sky-runner/','action'],
['小氣球鞋盒跑酷','跑跳挑戰','一起在街道上跳過鞋盒。','👟','#f4d7b5','runner-game/','action'],
['小氣球下樓梯','跑跳挑戰','踩準台階，和四寶一起向下挑戰。','🪜','#d8e9ed','https://sweet294728.github.io/little-balloon-downstairs/','action'],
['跳台挑戰','跑跳挑戰','抓準時機跳躍前進。','⭐','#f8dfa8','jump-game/','action'],
['倉庫裡有寶藏！','歡樂遊戲','操控夾爪，探索鞋盒寶藏。','🎁','#f2c9a9','treasure-game/','arcade'],
['小白鞋工廠彈珠台','歡樂遊戲','發射彈珠，挑戰更高分數。','🎯','#cce7e0','pinball-game/','arcade'],
['小氣球打細菌','歡樂遊戲','眼明手快趕走小細菌。','🔨','#f2d2bf','germ-game/','arcade'],
['小氣球接接樂','歡樂遊戲','移動接住掉落的驚喜。','🧺','#f4e3b2','catch-game/','arcade'],
['DKEC 氣球特攻隊','歡樂遊戲','認清目標，挑戰氣球任務。','🎈','#e5cddd','https://sweet294728.github.io/dkec-balloon-game/','arcade'],
['鞋盒疊疊樂','歡樂遊戲','穩穩疊高鞋盒，挑戰極限。','📦','#e9d0ab','shoe-stack/','arcade'],
['四寶方塊','動腦益智','和四寶一起挑戰方塊。','🧩','#d3e8df','./','puzzle'],
['小氣球記憶翻翻樂','動腦益智','翻開卡片，找出相同圖案。','🃏','#ecd8b7','memory-game/','puzzle'],
['五子棋・對弈時刻','動腦益智','想好下一步，連成五子。','⚫','#e2ded2','gomoku-game/','puzzle'],
['小白鞋工廠','動腦益智','組裝小白鞋，認識鞋子的構造。','👟','#d4e6ef','https://sweet294728.github.io/little-white-shoe-factory/','puzzle']];
const base='https://sweet294728.github.io/four-treasures-blocks/';let grid=document.querySelector('#grid');for(const [name,category,description,icon,color,path,group] of games){let a=document.createElement('a');a.className='game';a.dataset.group=group;a.href=new URL(path,base).href;a.style.setProperty('--color',color);let art=document.createElement('div');art.className='game-art';let sym=document.createElement('span');sym.setAttribute('aria-hidden','true');sym.textContent=icon;let badge=document.createElement('small');badge.textContent=category;art.append(sym,badge);let content=document.createElement('div');content.className='game-content';let title=document.createElement('h3');title.textContent=name;let desc=document.createElement('p');desc.textContent=description;let play=document.createElement('span');play.className='play';play.textContent='開始遊戲 →';content.append(title,desc,play);a.append(art,content);grid.append(a)}for(const b of document.querySelectorAll('.filter'))b.addEventListener('click',()=>{for(const x of document.querySelectorAll('.filter'))x.setAttribute('aria-pressed',String(x===b));for(const card of grid.children)card.hidden=b.dataset.filter!=='all'&&card.dataset.group!==b.dataset.filter});
</script></body></html>
