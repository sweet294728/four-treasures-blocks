<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f4eb"><title>小氣球記憶翻翻樂</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><section class="intro"><p class="eyebrow">一起來找找四寶！</p><h1>小氣球記憶<span>翻翻樂</span></h1><p class="description">翻開卡片，找到一樣的夥伴。<br>記住他們的位置，挑戰最快完成！</p></section><section class="game" aria-label="記憶翻牌遊戲"><div class="stats"><div><small>已找到</small><strong id="pairs">0 <em>/ 8</em></strong></div><div><small>時間</small><strong id="time">0 <em>秒</em></strong></div><div><small>翻牌次數</small><strong id="moves">0</strong></div></div><p id="golden-badge" class="golden-badge" hidden>✦ 黃金模式・分數 ×5 ✦</p><div class="board-wrap"><div id="board" class="board" aria-label="遊戲卡片"></div><div class="overlay" id="overlay"><div class="modal"><div class="mascots"><img src="assets/coarse-pixel-d.png" alt=""><img src="assets/coarse-pixel-k.png" alt=""><img src="assets/coarse-pixel-e.png" alt=""><img src="assets/coarse-pixel-c.png" alt=""></div><div id="setup-panel"><p class="modal-label" id="modal-label">READY TO PLAY?</p><h2 id="modal-title">準備好了嗎？</h2><p id="modal-text">找出 8 組相同的四寶，挑戰最快時間！</p><div class="difficulty-picker" role="group" aria-label="選擇難度"><button type="button" class="difficulty-button" data-size="4" aria-pressed="true">4 × 4<br><small>入門</small></button><button type="button" class="difficulty-button" data-size="6" aria-pressed="false">6 × 6<br><small>進階</small></button><button type="button" class="difficulty-button" data-size="8" aria-pressed="false">8 × 8<br><small>挑戰</small></button></div><button class="primary" id="start">開始遊戲 <span>→</span></button><p class="best" id="best"></p><p id="golden-hint" class="golden-hint" hidden>黃金模式已啟動：下一局分數 ×5</p><button type="button" class="rank-link" id="setup-ranking">查看排行榜</button></div><section id="result-panel" class="result-panel" aria-label="遊戲結算" hidden><p class="modal-label">STAGE CLEAR!</p><h2>配對完成！</h2><p class="result-caption">這次得到</p><p class="result-score"><strong id="result-score">0</strong> <span>分</span></p><p class="result-details" id="result-details"></p><form id="rank-form" class="rank-form"><label for="rank-name">輸入暱稱，登錄公開排行榜</label><div class="rank-entry"><input id="rank-name" maxlength="24" autocomplete="nickname" placeholder="輸入暱稱"><button id="rank-submit" type="submit">登錄</button></div><p id="rank-message" role="status"></p></form><button type="button" class="rank-link" id="result-ranking">查看排行榜</button><p class="score-rule">每組 100 分，加分依時間與多翻次數計算</p><a class="wheel-button" href="https://www.dk-shoes.com.tw/v2/GameModule/40931/gpc001/2026070241306" target="_blank" rel="noopener noreferrer">玩輪盤領好康 ↗</a><div class="result-actions"><button type="button" id="play-again">再玩一次</button><button type="button" id="choose-again">選擇難度</button></div></section><section id="pause-panel" class="pause-panel" hidden><p class="modal-label">PAUSED</p><h2>遊戲暫停</h2><div class="pause-actions"><button type="button" id="resume-game">繼續遊戲</button><button type="button" id="pause-restart">重新開始</button><button type="button" id="pause-choose">選擇難度</button><button type="button" id="pause-ranking">查看排行榜</button></div></section><section id="ranking-panel" class="ranking-panel" hidden><p class="modal-label">LEADERBOARD</p><h2>排行榜</h2><div class="rank-tabs" role="group" aria-label="排行榜難度"><button type="button" data-rank-size="4">4×4</button><button type="button" data-rank-size="6">6×6</button><button type="button" data-rank-size="8">8×8</button></div><p id="rank-status" role="status">讀取中…</p><div id="rank-list" class="rank-list"></div><button type="button" class="rank-link" id="rank-back">返回</button></section></div></div></div><div class="bottom"><p>✦ 點擊卡片，找出相同的角色</p><div class="controls"><button id="pause" class="text-button" type="button">暫停 Ⅱ</button><button id="sound" class="text-button" aria-pressed="true">音效：開 ♪</button><button id="music" class="text-button" aria-pressed="true">音樂：開 ♫</button></div></div><p id="announcement" class="sr-only" aria-live="polite"></p></section><footer>和四寶一起，讓每一天充滿好心情 <span>♡</span></footer></main><script src="leaderboard.js"></script><script src="game.js"></script></body></html>
