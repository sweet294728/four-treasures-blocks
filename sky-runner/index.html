;image-rendering:pixelated}.guide{display:grid;gap:4px;text-align:left}.guide-row{display:flex;align-items:center;gap:10px;background:#f0e9fa;border-radius:10px;padding:5px;font-weight:700;font-size:14px}.guide-row img{width:36px;height:36px;object-fit:contain;image-rendering:pixelated}.result-score{font-size:42px;font-weight:900;color:#bd5347;line-height:1.2}.result-sub{color:#886578}.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.result-actions button,.result-actions a{box-sizing:border-box;margin:0;padding:10px 4px;font-size:14px;text-align:center}.result-actions a{grid-column:1/-1;background:#f4b144;color:#66393a;border-radius:12px;text-decoration:none;font-weight:900}.result-actions button:disabled{opacity:.55}.card button:active{transform:scale(.94)}#pause{width:46px;height:46px;padding:0;background:transparent url('寶藏倉庫素材/介面道具/暫停鍵.png') center/contain no-repeat;font-size:0}#pause:active{transform:scale(.9)}@media(max-height:620px){.card{padding:10px}.card h1{font-size:20px;margin-bottom:3px}.guide-row{padding:2px}.guide-row img{width:26px;height:26px}}@media(prefers-reduced-motion:reduce){.char.selected{transform:none}}.card{background:transparent;border:32px solid transparent;border-image-source:url('寶藏倉庫素材/介面道具/彈窗面板.png');border-image-slice:130 100 fill;border-image-width:32px;border-image-repeat:stretch;border-radius:0;box-shadow:none;padding:10px 12px;max-width:350px}.card h1{margin-top:0}.card button{box-shadow:0 3px 0 #b56149}.card .char{box-shadow:none}.card .char:active{transform:scale(.94)}@media(max-height:620px){.card{border-width:24px;border-image-width:24px;padding:4px 8px}}#controls button{background:transparent url('寶藏倉庫素材/介面道具/方向鍵.png') center/contain no-repeat;font-size:0;width:74px;height:74px;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}#controls #right{transform:scaleX(-1)}#controls #left:active{transform:scale(.9)}#controls #right:active{transform:scaleX(-. (()=>{'use strict';const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),app=document.querySelector('#app'),panel=document.querySelector('#panel'),title=document.querySelector('#title'),message=document.querySelector('#message'),primary=document.querySelector('#primary'),restart=document.querySelector('#restart'),scoreEl=document.querySelector('#score'),livesEl=document.querySelector('#lives');let chosen='D',coins=0,pickups=[],nextHeart=1000,coinTimer=1,particles=[],shake=0,flash=0,squash=0,coinFeedback=null,ac=null,golden=false,travel=0,resultSaved=false,resultName='',resultMessage='',submitting=false;let state='start',lane=1,x=1,obstacles=[],distance=0,lives=3,spawn=0,elapsed=0,last=0,invuln=0,scroll=0,pointer=null;const W=360,H=640;canvas.width=W;canvas.height=H;
const root='寶藏倉庫素材/';const assets={};function load(k,path){let img=new Image();img.onload=()=>{assets[k]=img};img.onerror=()=>console.error('素材載入失敗：'+path);img.src=root+path}for(const c of ['D','K','E','C'])for(let i=1;i<=4;i++)load(c+i,`角色/${c}/run-${i}.png`);for(let i=1;i<=4;i++)load('spin'+i,`介面道具/金幣旋轉/spin-${i}.png`);for(const [k,path] of [['sky','場景/天空遠景.png'],['cloud','場景/雲朵.png'],['box','場景/鞋盒-遊戲用.png'],['heart','介面道具/愛心-遊戲用.png'],['coin','介面道具/金幣-遊戲用.png'],['meter','介面道具/距離框-遊戲用.png']])load(k,path);function pic(k,x,y,w,h){if(assets[k]){ctx.drawImage(assets[k],x,y,w,h);return true}return false}
function tone(freq=500,dur=.08){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();let o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(freq,ac.currentTime);o.frequency.exponentialRampToValueAtTime(freq*1.4,ac.currentTime+dur);g.gain.setValueAtTime(.035,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+dur)}catch(e){}}function burst(px,py,color){for(let i=0;i<10;i++){let a=Math.PI*2*i/10,speed=35+Math.random()*80;particles.push({x:px,y:py,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed-35,life:.5+Math.random()*.25,color})}}function chooseScreen(){state='select';show('雲端氣球跑酷','<p>選擇你的角色</p><div class="char-grid">'+['D','K','E','C'].map(c=>'<button class="char '+(chosen===c?'selected':'')+'" data-character="'+c+'"><img src="'+root+'角色/'+c+'/run-1.png" alt=""><span>'+c+' 寶</span></button>').join('')+'</div><button class="rank-open" id="open-ranking">排行榜</button>','玩法說明',intro);message.querySelector('#open-ranking').onclick=()=>showRanking(chooseScreen);message.querySelectorAll('[data-character]').forEach(b=>b.onclick=()=>{chosen=b.dataset.character;message.querySelectorAll('[data-character]').forEach(el=>el.classList.toggle('selected',el===b));tone(540)})}function intro(){state='intro';show('遊戲玩法','<div class="guide"><div class="guide-row"><img src="'+root+'角色/'+chosen+'/run-1.png" alt=""><span>左右滑動或用方向鍵換道</span></div><div class="guide-row"><img src="'+root+'場景/鞋盒-遊戲用.png" alt=""><span>閃避鞋盒，撞到會扣愛心</span></div><div class="guide-row"><img src="'+root+'介面道具/金幣-遊戲用.png" alt=""><span>收集金幣，挑戰更遠距離</span></div><div class="guide-row"><img src="'+root+'介面道具/愛心-遊戲用.png" alt=""><span>每 1000 公尺出現愛心，最多 3 顆</span></div></div>','開始遊戲',()=>{tone(650);start()});restart.hidden=false;restart.textContent='返回選角';restart.onclick=chooseScreen}function showRanking(back){state='ranking';show('排行榜','<p class="rank-status" id="rank-status">讀取中…</p><ol id="rank-list" class="rank-list"></ol>','返回',back);CloudRanks.read().then(data=>{let status=message.querySelector('#rank-status'),list=message.querySelector('#rank-list');if(!status||!list)return;status.textContent=data.records.length?'依距離排序，同距離比金幣':'目前還沒有成績';data.records.forEach((r,i)=>{const li=document.createElement('li');for(const value of [(i+1)+'. '+String(r.name),Number(r.distance).toLocaleString()+' m','🪙 '+Number(r.coins)]){let span=document.createElement('span');span.textContent=value;li.append(span)}list.append(li)})}).catch(()=>{let status=message.querySelector('#rank-status');if(status)status.textContent='排行榜暫時無法連線，請稍後再試'})}
function gameOver(){state='over';let value=golden?'DKEC':resultName;show(golden?'✦ 黃金挑戰結束 ✦':'挑戰結束！','<div class="result-sub">本次距離</div><div class="result-score">'+Math.floor(distance)+' <small>m</small></div><p class="result-sub">金幣 '+coins+' 枚</p><div class="rank-entry"><input id="rank-name" maxlength="12" placeholder="輸入暱稱" aria-label="暱稱"><button id="submit-score">登錄成績</button></div><p id="submit-status" class="rank-status" aria-live="polite"></p><div class="result-actions"><button id="result-ranking">排行榜</button><button id="choose-again">切換角色</button><a href="https://www.dk-shoes.com.tw/v2/GameModule/40931/gpc001/2026070241306" target="_blank" rel="noopener noreferrer">🎁 玩輪盤領好康</a></div>','再玩一次',start);let input=message.querySelector('#rank-name'),submit=message.querySelector('#submit-score'),status=message.querySelector('#submit-status');input.value=value;input.readOnly=golden;input.oninput=()=>{resultName=input.value};status.textContent=resultMessage;submit.disabled=resultSaved||submitting;primary.disabled=submitting;submit.onclick=()=>{resultName=input.value;CloudRanks.submit(resultName,Math.floor(distance),coins,golden,(ok,text)=>{submitting=ok===null;if(ok===true)resultSaved=true;resultMessage=text;let current=message.querySelector('#submit-status'),btn=message.querySelector('#submit-score');if(current&&btn&&state==='over'){current.textContent=text;btn.disabled=resultSaved||submitting;primary.disabled=submitting}})};message.querySelector('#choose-again').onclick=()=>{if(!submitting)chooseScreen()};message.querySelector('#result-ranking').onclick=()=>{if(!submitting)showRanking(gameOver)}}
function show(t,html,label,fn,again=false){title.textContent=t;message.innerHTML=html;primary.textContent=label;primary.onclick=fn;restart.hidden=!again;panel.hidden=false}function start(){if(submitting)return;golden=CloudRanks.consumeGolden();CloudRanks.reset();travel=0;resultSaved=false;resultName='';resultMessage='';primary.disabled=false;lane=1;x=1;obstacles=[];pickups=[];particles=[];shake=0;flash=0;squash=0;coinFeedback=null;coins=0;nextHeart=1000;coinTimer=1;distance=0;lives=3;spawn=.8;elapsed=0;invuln=0;scroll=0;state='play';panel.hidden=true;last=0;hud()}function hud(){scoreEl.textContent=Math.floor(distance)+' 公尺';livesEl.textContent='❤️'.repeat(lives)+'🤍'.repeat(3-lives)}function pause(){if(state!=='play')return;state='pause';restart.textContent='重新開始';restart.onclick=start;show('暫停中','<p>休息一下，準備好再繼續！</p><button id="pause-ranking" class="rank-open">排行榜</button>','繼續',()=>{state='play';panel.hidden=true;last=0},true);message.querySelector('#pause-ranking').onclick=()=>showRanking(()=>{state='play';pause()})}restart.onclick=start;document.querySelector('#pause').onclick=pause;function move(d){if(state==='play'){let prev=lane;lane=Math.max(0,Math.min(2,lane+d));if(lane!==prev){squash=.18;tone(380,.05)}}}document.querySelector('#left').onclick=()=>move(-1);document.querySelector('#right').onclick=()=>move(1);window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','a','d','A','D','Escape'].includes(e.key))e.preventDefault();if(e.repeat)return;if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')move(-1);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')move(1);if(e.key==='Escape')pause()});canvas.addEventListener('pointerdown',e=>{pointer={x:e.clientX,y:e.clientY}});canvas.addEventListener('pointerup',e=>{if(!pointer)return;let dx=e.clientX-pointer.x;if(Math.abs(dx)>25)move(dx>0?1:-1);pointer=null});canvas.addEventListener('pointercancel',()=>pointer=null);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
function safeLane(){let costs=[0,0,0];for(const o of obstacles)if(o.z<.22)costs[o.lane]++;let min=Math.min(...costs),choices=[0,1,2].filter(i=>costs[i]===min);return choices[Math.floor(Math.random()*choices.length)]}
function speedAt(d){return d<=1080?.72+d*.001:1.8+(d-1080)*.00025}function tick(dt){elapsed+=dt;if(coinFeedback){coinFeedback.time-=dt;if(coinFeedback.time<=0)coinFeedback=null}shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt);squash=Math.max(0,squash-dt);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=150*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);const speed=speedAt(travel);travel+=dt*speed*20;distance=travel*(golden?5:1);scroll+=dt*speed;invuln=Math.max(0,invuln-dt);x+=(lane-x)*Math.min(1,dt*12);spawn-=dt;if(spawn<=0){let blocked=Math.floor(Math.random()*3),protectedLanes=pickups.filter(p=>p.z<.22).map(p=>p.lane);let options=[0,1,2].filter(i=>!protectedLanes.includes(i));if(options.length){blocked=options[Math.floor(Math.random()*options.length)];obstacles.push({lane:blocked,z:0,hit:false});let remaining=options.filter(i=>i!==blocked);if(distance>100&&remaining.length&&Math.random()<Math.min(.65,.38+distance*.00025))obstacles.push({lane:remaining[Math.floor(Math.random()*remaining.length)],z:0,hit:false})}spawn=(.75+Math.random()*.15)/speed}while(distance>=nextHeart){pickups.push({type:'heart',lane:safeLane(),z:0,hit:false});nextHeart+=1000}coinTimer-=dt;if(coinTimer<=0){pickups.push({type:'coin',lane:safeLane(),z:0,hit:false});coinTimer=1.7+Math.random()*.6}for(const o of obstacles){o.z+=dt*speed*.42;if(!o.hit&&o.z>=.86){o.hit=true;if(Math.abs(x-o.lane)<.46&&invuln<=0){lives--;invuln=1.3;shake=.3;flash=.18;burst(roadX(x,playerZ),roadY(playerZ)-35,'#ff7891');tone(160,.16);if(lives<=0){gameOver();break}}}}for(const p of pickups){p.z+=dt*speed*.42;if(!p.hit&&p.z>=.86){p.hit=true;if(Math.abs(x-p.lane)<.46){if(p.type==='heart'){lives=Math.min(3,lives+1);burst(roadX(p.lane,playerZ),roadY(playerZ)-45,'#ff6988');tone(620,.14)}else{coins++;let cx=roadX(p.lane,playerZ),cy=roadY(playerZ)-60;coinFeedback={x:cx,y:cy,time:.9};burst(cx,cy,'#ffdc55');burst(cx,cy,'#fff5b2');tone(880,.12);setTimeout(()=>tone(1250,.14),85)}squash=.15;p.collected=true}}}obstacles=obstacles.filter(o=>o.z<1.2);pickups=pickups.filter(p=>p.z<1.12&&!p.collected);hud()}
const horizon=230, playerZ=.86;function depth(z){return Math.pow(z/playerZ,2)}function roadX(lane,z){return 180+(lane-1)*(34+106*depth(z))}function roadY(z){return horizon+(560-horizon)*depth(z)}
function drawDriftingClouds(){const clouds=[{x:-30,y:175,w:65,v:7,p:0},{x:258,y:140,w:82,v:5,p:90},{x:10,y:355,w:62,v:4,p:170},{x:295,y:400,w:58,v:6,p:250}];for(const c of clouds){let x=((c.x+c.p+elapsed*c.v)%500+500)%500-c.p;while(x>W+90)x-=500;while(x< -120)x+=500;let y=c.y+Math.sin(elapsed*.45+c.p)*4;pic('cloud',x,y,c.w,c.w*.35)}}
function drawSkyRoad(){const bottomZ=playerZ*Math.sqrt((H-horizon)/(560-horizon)),left0=roadX(-.5,0),right0=roadX(2.5,0),leftB=roadX(-.5,bottomZ),rightB=roadX(2.5,bottomZ);let grad=ctx.createLinearGradient(0,horizon,0,H);grad.addColorStop(0,'#bed9ff');grad.addColorStop(1,'#8ba6ed');ctx.fillStyle=grad;ctx.beginPath();ctx.moveTo(left0,horizon);ctx.lineTo(right0,horizon);ctx.lineTo(rightB,H);ctx.lineTo(leftB,H);ctx.closePath();ctx.fill();ctx.strokeStyle='#e8f4ff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(left0,horizon);ctx.lineTo(leftB,H);ctx.moveTo(right0,horizon);ctx.lineTo(rightB,H);ctx.stroke()}
function draw(){ctx.clearRect(0,0,W,H);ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*shake*20,(Math.random()-.5)*shake*15);ctx.fillStyle='#4f2e40';ctx.fillRect(0,0,W,H);if(assets.sky){let drift=Math.sin(scroll*.09)*4;ctx.drawImage(assets.sky,-6+drift,0,W+12,H)}drawDriftingClouds();drawSkyRoad();ctx.fillStyle='#f7faff';for(let i=0;i<12;i++){let z=(i/12+scroll*.25)%1.12,z2=Math.min(z+.045,1.12);if(roadY(z)>H)continue;for(let k of [-.5,.5]){let x1=roadX(1+k,z),x2=roadX(1+k,z2),w1=Math.max(.7,7*depth(z)),w2=Math.max(.7,7*depth(z2));ctx.beginPath();ctx.moveTo(x1-w1,roadY(z));ctx.lineTo(x1+w1,roadY(z));ctx.lineTo(x2+w2,roadY(z2));ctx.lineTo(x2-w2,roadY(z2));ctx.closePath();ctx.fill()}}let items=[...obstacles.map(o=>({...o,type:'box'})),...pickups].sort((a,b)=>a.z-b.z);for(const o of items){let z=o.z;if(z>playerZ+.015)continue;let px=roadX(o.lane,z),y=roadY(z),s=9+z/playerZ*69;if(o.type==='box'){if(!pic('box',px-s/2,y-s*.49,s,s*.49)){ctx.fillStyle='#efbc34';ctx.fillRect(px-s/2,y-s*.49,s,s*.49)}}else{let bob=Math.sin(elapsed*7+o.lane)*3,scale=o.type==='heart'?1+.12*Math.sin(elapsed*8):1;let h=s*.65;ctx.save();ctx.translate(px,y-h*.5+bob);ctx.scale(scale,1);if(!pic(o.type==='coin'?'spin'+(Math.floor(elapsed*8)%4+1):o.type,-h/2,-h/2,h,h)){ctx.fillStyle='#ffdc51';ctx.beginPath();ctx.arc(0,0,h*.3,0,Math.PI*2);ctx.fill()}ctx.restore()}}if(invuln<=0||Math.floor(invuln*10)%2===0){let px=roadX(x,playerZ),y=roadY(playerZ);ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(px,y,22,7,0,0,Math.PI*2);ctx.fill();let frame=Math.floor(elapsed*8)%4+1;ctx.save();if(golden)ctx.filter='sepia(1) saturate(2.6) hue-rotate(4deg) brightness(1.12)';if(!pic(chosen+frame,px-47-(squash>0?4:0),y-92+(squash>0?5:0),94+(squash>0?8:0),94-(squash>0?5:0))){ctx.fillStyle='#62baff';ctx.beginPath();ctx.arc(px,y-35,24,0,Math.PI*2);ctx.fill()}ctx.restore()}for(const p of particles){ctx.globalAlpha=Math.min(1,p.life*3);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4)}ctx.globalAlpha=1;if(flash>0){ctx.fillStyle='rgba(255,85,120,'+(flash*.8)+')';ctx.fillRect(0,0,W,H)}ctx.restore();if(coinFeedback){let t=1-coinFeedback.time/.9,cx=coinFeedback.x,cy=coinFeedback.y;ctx.save();ctx.globalAlpha=Math.min(1,coinFeedback.time*3);ctx.strokeStyle='#ffe574';ctx.lineWidth=4*(1-t)+1;ctx.beginPath();ctx.arc(cx,cy,18+35*t,0,Math.PI*2);ctx.stroke();ctx.font='900 27px system-ui';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='#ad5a27';ctx.strokeText('+1',cx,cy-24-35*t);ctx.fillStyle='#fff1a5';ctx.fillText('+1',cx,cy-24-35*t);ctx.restore()}for(let i=0;i<3;i++){ctx.globalAlpha=i<lives?1:.25;let pulse=1+.06*Math.sin(elapsed*6+i*.3);if(!pic('heart',12+i*31,13-(pulse-1)*12,27*pulse,25*pulse)){ctx.fillStyle='red';ctx.fillText('♥',12+i*31,33)}}ctx.globalAlpha=1;pic('meter',126,12,155,38);ctx.fillStyle='white';ctx.textAlign='right';ctx.font='bold 17px system-ui';ctx.fillText(Math.floor(distance)+' m',270,38);ctx.save();let coinPulse=coinFeedback?1+.3*Math.sin(Math.min(1,(.9-coinFeedback.time)*5)*Math.PI):1;ctx.translate(22,58);ctx.scale(coinPulse,coinPulse);pic('coin',-10,-10,21,20);ctx.restore();ctx.textAlign='left';ctx.fillStyle=coinFeedback?'#ffe87d':'white';ctx.fillText('× '+coins,36,65);if(golden){ctx.textAlign='center';ctx.font='bold 13px system-ui';ctx.fillStyle='#ffe56c';ctx.fillText('✦ 黃金模式 ×5 ✦',180,78)}}function frame(t){if(!last)last=t;let dt=Math.min((t-last)/1000,.05);last=t;if(state==='over'){shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=150*dt;p.life-=dt}particles=particles.filter(p=>p.life>0)}if(state==='play'){let remaining=dt;while(remaining>0&&state==='play'){let step=Math.min(remaining,.03/Math.max(1,speedAt(travel)));tick(step);remaining-=step}}draw();requestAnimationFrame(frame)}chooseScreen();requestAnimationFrame(frame)})();
