let mode='unlimited',deadline=0,runId=0,peak=0,pausedAt=0,priorState='playing',boardReturn='result',collapseRemaining=0;let nextBundleId=1;let W=0,H=0,dpr=1,state='ready',boxes=[],falling=[],active=null,particles=[],texts=[],score=0,lives=3,combo=0,camera=0,camTarget=0,t=0,last=0,sway=0,gravityGlow=.5,gravityRisk=0,shake=0,flash=0,freeze=0,audio=null;

pauseButton.onclick=pauseGame;$('resume').onclick=resumeGame;$('restart').onclick=()=>reset(mode);$('replay').onclick=()=>reset(mode);$('result-modes').onclick=chooseModes;$('pause-modes').onclick=chooseModes;$('result-board').onclick=()=>{boardReturn='result';showScreen('board')};$('pause-board').onclick=()=>{boardReturn='pause';showScreen('board')};$('board-back').onclick=()=>showScreen(boardReturn);
function drop(){if(state!=='playing'||!active||active.status!=='swing')return;active.status='fall';active.vy=0;sound(360,.08,'triangle')};canvas.addEventListener('pointerdown',drop);window.addEventListener('keydown',e=>{if(e.code==='Space'&&state==='playing'){e.preventDefault();drop()}});
function burst(x,y,color,n=16){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,v=60+Math.random()*200;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,life:.5+Math.random()*.5,max:1,color,r:2+Math.random()*5})}}
function label(text,x,y,color){texts.push({text,x,y,life:1,color})}
function balanceIndicator(){let weighted=0,mass=0,risk=0,center=.5;for(let i=boxes.length-1;i>=0;i--){const b=boxes[i],m=b.w*b.h;weighted+=b.x*m;mass+=m;const below=i?boxes[i-1]:{x:W/2,w:unit()*1.25};if(i&&b.bundleId===below.bundleId)continue;const left=Math.max(b.x-b.w/2,below.x-below.w/2),right=Math.min(b.x+b.w/2,below.x+below.w/2);const midpoint=(left+right)/2,half=(right-left)/2;let r=half>0?Math.min(1,Math.abs(weighted/mass-midpoint)/half):1;if(r>risk){risk=r;center=Math.max(.08,Math.min(.92,weighted/mass/W))}}return {risk,center}}
function stability(){let weighted=0,mass=0;for(let i=boxes.length-1;i>=0;i--){const b=boxes[i],m=b.w*b.h;weighted+=b.x*m;mass+=m;const below=i?boxes[i-1]:{x:W/2,w:unit()*1.25};const left=Math.max(b.x-b.w/2,below.x-below.w/2),right=Math.min(b.x+b.w/2,below.x+below.w/2);if(weighted/mass<left||weighted/mass>right)return {index:i,direction:weighted/mass<(left+right)/2?-1:1}}return null}
function collapse(failure){
 state='collapse';active=null;shake=18;sound(100,.45,'sawtooth',.09);
 label('失去平衡！',W/2,camera+H*.42,'#e76c63');
 // A tied bundle is one rigid load: if any box in it loses support, remove the entire bundle.
 let first=failure.index;while(first>0&&boxes[first].bundleId===boxes[first-1].bundleId)first--;
 falling=boxes.splice(first);let groups=new Map();
 for(const box of falling){if(!groups.has(box.bundleId))groups.set(box.bundleId,{x:box.x,y:box.y,vx:failure.direction*(8+Math.random()*12),vy:0,spin:failure.direction*(.25+Math.random()*.25),rotation:0});box.group=groups.get(box.bundleId);box.offsetY=box.y-box.group.y}
 score=boxes.length;scoreEl.textContent=score;lives--;combo=0;livesEl.textContent=Array(lives).fill('●').concat(Array(3-lives).fill('○')).join(' ');

}
function land(){let a=active,top=boxes.length?boxes[boxes.length-1]:null,tx=top?top.x:W/2,tw=top?top.w:unit()*1.25,overlap=(a.w+tw)/2-Math.abs(a.x-tx),ratio=overlap/Math.min(a.w,tw);if(overlap<=Math.min(a.w,tw)*.15){lives--;combo=0;shake=12;sound(130,.25,'sawtooth');label('沒接住！',a.x,a.y,'#e76c63');burst(a.x,a.y,'#e9927e',12);a.status='miss';a.vy=100;livesEl.textContent=Array(lives).fill('●').concat(Array(3-lives).fill('○')).join(' ');return}let perfect=Math.abs(a.x-tx)<Math.min(a.w,tw)*.09;if(perfect){a.x=tx;combo++;flash=.25;freeze=.055;sound(650+Math.min(combo,8)*75,.16,'triangle',.09);label(combo>1?'完美！ '+combo+' 連擊':'完美！',a.x,a.y-15,'#ef8c5e');burst(a.x,a.y,'#ffc05c',22)}else{combo=0;sound(220+ratio*140,.13,'triangle',.08);burst(a.x,a.y,'#c5a898',9);if(ratio<.48)label('好險！',a.x,a.y-12,'#e88872')}shake=perfect?7:Math.max(4,(1-ratio)*12);let bottom=a.y,bundleId=nextBundleId++,offset=0;for(let i=0;i<a.n;i++){let item=a.items[i];boxes.push({bundleId,x:a.x,y:bottom-offset,w:item.w,h:item.h,size:item.size,bundle:a.n,bundleW:a.bundleW,index:i,tilt:0,color:['#f0a78e','#eec690','#a9c7bd'][Math.round((1-item.size)*10)]||'#f0a78e'});offset+=item.h}score+=a.n;scoreEl.textContent=score;camTarget=Math.min(0,(bottom-a.totalH)-H*.66);active=null;let failure=stability();if(failure){collapse(failure);return}peak=Math.max(peak,score);let spawnRun=runId;setTimeout(()=>{if(spawnRun===runId&&state==='playing'&&!active)spawn()},320)}

 ctx.save();ctx.translate(x,y);ctx.shadowColor='#58431f55';ctx.shadowBlur=6;ctx.shadowOffsetY=3;

}
function failureDirection(g){return g.spin<0?-1:1}
function update(dt){t+=dt;if(freeze>0){freeze-=dt;return}camera+=(camTarget-camera)*Math.min(1,dt*4);let balance=balanceIndicator();gravityGlow+=(balance.center-gravityGlow)*Math.min(1,dt*5);gravityRisk+=(balance.risk-gravityRisk)*Math.min(1,dt*5);let strength=Math.min(1,Math.max(0,(boxes.length-3)/12));let lean=boxes.length?boxes.reduce((v,b)=>v+(b.x-W/2),0)/boxes.length/unit():0;let desired=state==='playing'?strength*(Math.sin(t*1.7)*.009+Math.max(-.014,Math.min(.014,lean*.018))):0;sway+=(desired-sway)*Math.min(1,dt*3);shake*=Math.pow(.03,dt);flash=Math.max(0,flash-dt);for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=350*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);for(let q of texts){q.y-=45*dt;q.life-=dt}texts=texts.filter(q=>q.life>0);if(state==='collapse'){collapseRemaining-=dt;if(collapseRemaining<=0){falling=[];if(lives<=0)endGame('lives');else{state='playing';spawn()}return}for(let g of new Set(falling.map(b=>b.group))){g.x+=g.vx*dt;g.y+=g.vy*dt;g.vy+=850*dt;g.spin+=failureDirection(g)*1.4*dt;g.rotation+=g.spin*dt}return}if(!active||state!=='playing')return;let a=active;let target=boxes.length?boxes[boxes.length-1].y-boxes[boxes.length-1].h:base();if(a.status==='swing'){a.x=W/2+Math.sin(t*1.75+a.phase)*(W*.36);a.y=camera+Math.max(a.totalH+24,Math.min(H*.38,target-camera-35));a.angle=Math.cos(t*1.75+a.phase)*.10}else if(a.status==='fall'){a.vy+=1200*dt;a.y+=a.vy*dt;if(a.y>=target){a.y=target;land()}}else{a.vy+=1100*dt;a.y+=a.vy*dt;a.angle+=dt*2;if(a.y-camera>H+100){active=null;if(lives<=0){endGame('lives');sound(160,.3,'triangle')}else spawn()}}}
function drawClouds(rise,skyMix){
 const density=Math.max(0,Math.min(1,(rise-.3)/4));
 for(let i=0;i<14;i++){
  let near=i%2===0,img=near?art.cloudNear:art.cloudFar;if(!artReady(img))continue;
  let threshold=i/14,appearance=Math.max(0,Math.min(1,(density-threshold)*8+.18));if(!appearance)continue;
  let speed=near?.42:.20,wrap=1.45,phase=((i*.381966+rise*speed)%wrap+wrap)%wrap;
  let y=phase*H-H*.22,w=W*(near?.52:.34)*(1+(i%3)*.13),h=w*img.naturalHeight/img.naturalWidth;
  let side=i%4<2?-.13:.69,x=W*(side+(i%3)*.035)+Math.sin(t*.12+i*1.7)*W*.065;
  ctx.save();ctx.globalAlpha=skyMix*appearance*(near?.77:.50);ctx.drawImage(img,x,y,w,h);ctx.restore();

}
function drawTrees(rise){if(!artReady(art.tree))return;let tw=W*.52,th=tw*art.tree.naturalHeight/art.tree.naturalWidth;for(let i=0;i<2;i++){let x=i?W*.94:W*.06,y=H*.83+rise*H*.60,angle=Math.sin(t*.75+i*1.7)*.035+Math.sin(t*.33+i)*.012;ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.drawImage(art.tree,-tw/2,-th,tw,th);ctx.restore()}}
function render(){ctx.clearRect(0,0,W,H);let center=Math.max(.08,Math.min(.92,gravityGlow));let rise=Math.max(0,-camera/H);
