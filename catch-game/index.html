<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>小氣球接接樂</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#102d55;font-family:system-ui,sans-serif}body{display:grid;place-items:center;overflow:hidden}.shell{width:min(100vw,56.25dvh);height:min(100dvh,177.7778vw)}h1,.sub,.hint{display:none}.stage{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none;background:#168beb}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}.pause{position:absolute;right:3%;top:1.5%;border:3px solid #a85a00;border-radius:8px;background:#ffd43c;color:#173a6c;font-size:20px;font-weight:bold;padding:4px 11px;cursor:pointer;z-index:2}.pause[hidden]{display:none}.sound{position:absolute;right:16%;top:1.5%;border:3px solid #a85a00;border-radius:8px;background:#ffd43c;color:#173a6c;font-size:18px;padding:4px 8px;z-index:2;cursor:pointer}.sound[hidden]{display:none}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#14396788;padding:6%}.overlay.hidden{display:none}.card{background:#fff8df;color:#17345b;border:4px solid #244270;border-radius:8px;padding:22px 14px;width:100%;box-shadow:0 8px 0 #518aa1;text-align:center}.card h2{margin:0 0 10px;color:#a32f50}.germ-icon{width:25px;height:25px;vertical-align:middle;image-rendering:pixelated}.card p{line-height:1.7;font-size:15px;font-weight:600;color:#17345b;margin:6px}.btn{border:0;border-radius:30px;background:#ffc83d;color:#17345b;font-weight:bold;font-size:19px;padding:12px 36px;box-shadow:0 5px 0 #b75c68;cursor:pointer;margin:12px 0 3px}.rank-area{max-height:38dvh;overflow:auto}.card input{width:60%;padding:9px;border:2px solid #244270;border-radius:6px;font-size:16px}.card .smallbtn,.wheel{display:inline-block;border:0;border-radius:8px;background:#ffc83d;color:#17345b;font-weight:bold;font-size:15px;padding:10px 15px;margin:5px;text-decoration:none;cursor:pointer}.card.result{padding:14px 14px 16px;max-height:94%;overflow-y:auto}.card.result h2{margin-bottom:2px}.card.result #message{line-height:1.3;margin:2px 0 8px}.result-score{display:block;color:#b02e49;font-size:clamp(34px,10vw,48px);font-weight:900;line-height:1.05;margin:3px 0}.card.result .wheel{display:block;background:#fa596d;color:#fff;font-size:20px;border:3px solid #9d2d45;border-radius:13px;padding:13px 10px;margin:8px auto;box-shadow:0 4px 0 #9d2d45}.card.result #start{font-size:15px;padding:9px 28px;margin-top:8px;background:#e5edf1;box-shadow:0 3px 0 #9fb1bd}.card.result .rank-message{margin:2px;min-height:1em}.rank-row{display:flex;justify-content:space-between;border-bottom:1px solid #b7c8d6;padding:5px}.rank-message{min-height:1.5em}.gold-badge{position:absolute;top:12%;left:50%;transform:translateX(-50%);background:#ffe061;color:#654208;padding:5px 12px;font-weight:bold;border:2px solid #a85a00;border-radius:7px;z-index:1}.gold-badge[hidden]{display:none}</style></head><body><main class="shell"><h1>🎈 小氣球接接樂</h1><p class="sub">和小精靈一起收集天空的驚喜！</p><div class="stage" id="stage"><canvas id="game" width="400" height="711" aria-label="接氣球遊戲畫面"></canvas><button class="sound" id="sound" aria-label="關閉音效" aria-pressed="true" hidden>🔊</button><button class="pause" id="pause" aria-label="暫停遊戲" hidden>Ⅱ</button><div id="gold-badge" class="gold-badge" hidden>✦ 黃金模式 ×5 ✦</div><div class="overlay" id="overlay"><div class="card"><h2 id="title">準備好了嗎？</h2><p id="message">拖曳空氣鞋，接住掉下來的四寶！<br>四寶 +10 分　<img class="germ-icon" src="pixel-assets/germ/clean.png" alt="細菌"> 細菌扣一顆心<br>漏接四寶也會扣心，共有 3 顆心。<br>接住 ❤️ 可回復一顆心（最多 3 顆）。<br>時間越久，挑戰越快！</p><button class="btn" id="start">開始遊戲</button><div id="extra"><button type="button" class="smallbtn" id="ranking">查看排行榜</button></div></div></div></div><p class="hint">手機：拖曳畫面　｜　電腦：拖曳或按方向鍵 / A、D</p></main><script src="leaderboard.js"></script><script>
const c=document.querySelector('#game'),ctx=c.getContext('2d'),stage=document.querySelector('#stage'),overlay=document.querySelector('#overlay'),title=document.querySelector('#title'),message=document.querySelector('#message'),start=document.querySelector('#start');const shoe=new Image();shoe.src='pixel-assets/shoe/trimmed.png';const sprites=['c','d','e','k'].map(n=>{let i=new Image();i.src='pixel-assets/'+n+'/clean.png';return i});const bg=new Image();bg.src='pixel-assets/background.png';const germ=new Image();germ.src='pixel-assets/germ/clean.png';const pause=document.querySelector('#pause'),sound=document.querySelector('#sound');let audio=null,soundOn=true,particles=[],popups=[],bounce=0,shake=0,flash=0,scorePulse=0;let paused=false,goldenNext=false,goldenMode=false,runId=0,rankSaved=false,rankSubmitting=false;const extra=document.querySelector('#extra'),badge=document.querySelector('#gold-badge');let state='ready',score=0,lives=3,items=[],player=200,keys={},last=0,elapsed=0,spawn=0;const colors=['#ff9eaa','#ffd477','#9be1d5','#bcb2ef','#8bcbee'];
function tone(bad){if(!soundOn)return;try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;audio=audio||new A();if(audio.state==='suspended')audio.resume();const now=audio.currentTime;for(let i=0;i<(bad?1:2);i++){let o=audio.createOscillator(),g=audio.createGain();o.type=bad?'sawtooth':'square';o.frequency.setValueAtTime(bad?190:520+i*200,now+i*.065);o.frequency.exponentialRampToValueAtTime(bad?90:720+i*220,now+i*.065+.09);g.gain.setValueAtTime(.035,now+i*.065);g.gain.exponentialRampToValueAtTime(.001,now+i*.065+.12);o.connect(g);g.connect(audio.destination);o.start(now+i*.065);o.stop(now+i*.065+.13)}}catch(e){}}
function feedback(x,y,bad,miss=false,heart=false){bounce=bad?.15:.22;shake=bad?.18:0;flash=bad?.18:0;scorePulse=bad?0:.22;popups.push({x,y,life:.8,text:bad?(miss?'漏接！':'小心！'):heart?'❤️ +1':'+10',bad});for(let i=0;i<(bad?9:14);i++){let angle=Math.random()*Math.PI*2,speed=50+Math.random()*150;particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-35,life:.35+Math.random()*.3,max:.65,color:bad?['#af6ee8','#ff758d','#fff'][i%3]:['#ffe65a','#fff','#8cfcff','#ff9ac2'][i%4],size:3+Math.random()*5})}tone(bad);if(bad&&navigator.vibrate)navigator.vibrate(35)}
function begin(){start.parentNode.classList.remove('result');start.parentNode.insertBefore(start,extra);goldenMode=goldenNext;goldenNext=false;runId++;rankSaved=false;rankSubmitting=false;badge.hidden=!goldenMode;extra.innerHTML='<button type="button" class="smallbtn" id="ranking">查看排行榜</button>';particles=[];popups=[];bounce=shake=flash=scorePulse=0;sound.hidden=false;score=0;lives=3;items=[];player=200;elapsed=0;spawn=0;last=0;keys={};state='playing';paused=false;pause.hidden=false;pause.textContent='Ⅱ';overlay.classList.add('hidden');requestAnimationFrame(loop)}
function formatTime(seconds){const n=Math.floor(seconds);return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function end(){state='over';badge.hidden=true;pause.hidden=true;sound.hidden=true;title.textContent='遊戲結束！';message.innerHTML=`這次收集了 <strong class="result-score">${score.toLocaleString()} 分</strong>堅持時間 ${formatTime(elapsed)}`;start.textContent='再玩一次';start.parentNode.classList.add('result');start.parentNode.appendChild(start);showResult();overlay.classList.remove('hidden')}
function balloon(x,y,color){ctx.strokeStyle='#9eb4b2';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x,y+17);ctx.quadraticCurveTo(x+8,y+28,x,y+38);ctx.stroke();ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,14,18,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffffff99';ctx.beginPath();ctx.ellipse(x-5,y-7,3,6,.4,0,7);ctx.fill();ctx.fillStyle=color;ctx.fillRect(x-3,y+16,6,4)}
function cloud(x,y){ctx.fillStyle='#81959e';ctx.beginPath();ctx.arc(x-9,y,10,0,7);ctx.arc(x+2,y-7,13,0,7);ctx.arc(x+13,y,10,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(x-7,y-1,3,3);ctx.fillRect(x+5,y-1,3,3)}
function draw(){ctx.clearRect(0,0,400,711);ctx.imageSmoothingEnabled=false;ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*6,(Math.random()-.5)*5);if(bg.complete&&bg.naturalWidth)ctx.drawImage(bg,0,0,400,711);else{ctx.fillStyle='#168beb';ctx.fillRect(0,0,400,711)}for(const o of items){if(o.heart){ctx.font='36px system-ui';ctx.textAlign='center';ctx.fillText('❤️',o.x,o.y+13);ctx.textAlign='left';continue}const sprite=o.bad?germ:sprites[o.kind];if(sprite.complete&&sprite.naturalWidth){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(Math.sin(elapsed*4+o.phase)*.12);ctx.drawImage(sprite,-35,-35,70,70);ctx.restore()}}if(shoe.complete&&shoe.naturalWidth){let lift=bounce>0?Math.sin((bounce/.22)*Math.PI)*8:0;ctx.drawImage(shoe,player-78,600-lift,156,156*shoe.naturalHeight/shoe.naturalWidth)}for(const p of particles){ctx.globalAlpha=Math.min(1,p.life/.2);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.size,p.size)}ctx.globalAlpha=1;for(const p of popups){ctx.globalAlpha=Math.min(1,p.life/.25);ctx.font='bold 25px system-ui';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='#183766';ctx.strokeText(p.text,p.x,p.y);ctx.fillStyle=p.bad?'#ff8787':'#ffeb58';ctx.fillText(p.text,p.x,p.y)}ctx.globalAlpha=1;ctx.restore();if(flash>0){ctx.globalAlpha=flash*1.1;ctx.fillStyle=shake>0?'#ff526c':'#fff5a6';ctx.fillRect(0,0,400,711);ctx.globalAlpha=1}ctx.fillStyle='#143967';ctx.fillRect(10,10,135,32);ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.strokeRect(10,10,135,32);ctx.fillStyle=scorePulse>0?'#ffe45b':'#fff';ctx.textAlign='left';ctx.font='bold 17px monospace';ctx.fillText('SCORE '+score,18,32);ctx.font='20px system-ui';ctx.fillText('❤️'.repeat(lives),157,32);ctx.fillStyle='#143967';ctx.fillRect(10,50,110,27);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(10,50,110,27);ctx.fillStyle='#fff';ctx.font='bold 16px monospace';ctx.fillText('TIME '+formatTime(elapsed),16,69)}
function loop(t){if(state!=='playing')return;let dt=Math.min((t-(last||t))/1000,.04);last=t;elapsed+=dt;spawn+=dt;bounce=Math.max(0,bounce-dt);shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt);scorePulse=Math.max(0,scorePulse-dt);for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=210*dt}particles=particles.filter(p=>p.life>0);for(const p of popups){p.life-=dt;p.y-=55*dt}popups=popups.filter(p=>p.life>0);if(keys.left)player-=250*dt;if(keys.right)player+=250*dt;player=Math.max(40,Math.min(360,player));if(spawn>Math.max(.38,1.12-elapsed*.008)){spawn=0;let roll=Math.random();items.push({x:25+Math.random()*350,y:-25,heart:roll<.025,bad:roll>=.025&&roll<.225,kind:Math.floor(Math.random()*4),phase:Math.random()*6.28,speed:(100+Math.min(elapsed*1.6,150))*(.7+Math.random()*.7)})}for(let i=items.length-1;i>=0;i--){let o=items[i];o.y+=o.speed*dt;if(o.y>600&&o.y<660&&Math.abs(o.x-player)<55){if(o.heart){let restored=lives<3;lives=Math.min(3,lives+1);feedback(o.x,580,false,false,restored);if(!restored)popups[popups.length-1].text='滿血！'}else{if(o.bad)lives--;else score+=goldenMode?50:10;feedback(o.x,580,o.bad);if(!o.bad&&goldenMode)popups[popups.length-1].text='+50'}items.splice(i,1)}else if(o.y>720){if(!o.bad&&!o.heart){lives--;feedback(o.x,660,true,true)}items.splice(i,1)}if(lives<=0){draw();end();return}}draw();requestAnimationFrame(loop)}
sound.addEventListener('click',()=>{soundOn=!soundOn;sound.textContent=soundOn?'🔊':'🔇';sound.setAttribute('aria-label',soundOn?'關閉音效':'開啟音效');sound.setAttribute('aria-pressed',String(soundOn))});function showResult(){extra.innerHTML=`<form id="rank-form"><label for="rank-name">輸入暱稱，登錄公開排行榜</label><br><input id="rank-name" maxlength="24" autocomplete="nickname" placeholder="輸入暱稱" ${goldenMode?'value="DKEC" readonly':''}><button class="smallbtn" id="rank-submit">登錄</button><p class="rank-message" id="rank-message" role="status">${goldenMode?'黃金模式：本局分數 ×5':''}</p></form><button type="button" class="smallbtn" id="ranking">查看排行榜</button><a class="wheel" href="https://www.dk-shoes.com.tw/v2/GameModule/40931/gpc001/2026070241306" target="_blank" rel="noopener noreferrer">玩輪盤領好康 ↗</a>`;}
function showRanking(){const old=extra.innerHTML;extra.innerHTML='<div class="rank-area"><h2>排行榜</h2><p id="rank-status">讀取中…</p><div id="rank-list"></div></div><button type="button" class="smallbtn" id="rank-back">返回</button>';start.hidden=true;const list=document.querySelector('#rank-list'),status=document.querySelector('#rank-status');window.CatchLeaderboard.read().then(data=>{if(!list.isConnected)return;status.textContent=data.records.length?'依分數由高到低':'目前還沒有紀錄';for(const [i,r] of data.records.entries()){const row=document.createElement('div'),name=document.createElement('span'),points=document.createElement('b');row.className='rank-row';name.textContent=(i+1)+'. '+String(r.name||'')+(r.golden?' ✨':'');points.textContent=Number(r.score).toLocaleString()+' 分';row.append(name,points);list.append(row)}}).catch(e=>{if(list.isConnected)status.textContent=e.message});document.querySelector('#rank-back').onclick=()=>{start.hidden=false;if(state==='over')showResult();else extra.innerHTML=old}}
extra.addEventListener('click',e=>{if(e.target.id==='ranking')showRanking()});extra.addEventListener('submit',e=>{if(e.target.id!=='rank-form')return;e.preventDefault();if(rankSaved||rankSubmitting)return;let msg=document.querySelector('#rank-message'),button=document.querySelector('#rank-submit'),name;try{name=window.CatchLeaderboard.nickname(document.querySelector('#rank-name').value)}catch(err){msg.textContent=err.message;return}if(!goldenMode&&name.toUpperCase()==='DKEC'){goldenNext=true;msg.textContent='黃金模式已啟動，下一局分數 ×5！';return}rankSubmitting=true;button.disabled=true;msg.textContent='正在登錄排行榜…';const current=runId;window.CatchLeaderboard.submit({nickname:goldenMode?'DKEC':name,score,character:'c',golden:goldenMode}).then(()=>{if(current!==runId)return;rankSubmitting=false;rankSaved=true;if(msg.isConnected){msg.textContent='成績已登錄排行榜！';button.textContent='已登錄'}}).catch(err=>{if(current!==runId)return;rankSubmitting=false;if(msg.isConnected){button.disabled=false;msg.textContent=err.message}})});
start.addEventListener('click',()=>{if(paused){paused=false;state='playing';last=0;overlay.classList.add('hidden');pause.textContent='Ⅱ';requestAnimationFrame(loop)}else begin()});pause.addEventListener('click',()=>{if(state!=='playing')return;state='paused';paused=true;keys={};extra.innerHTML='<button type="button" class="smallbtn" id="ranking">查看排行榜</button>';title.textContent='遊戲暫停';message.textContent='休息一下，準備好再繼續！';start.textContent='繼續遊戲';pause.textContent='▶';overlay.classList.remove('hidden')});addEventListener('keydown',e=>{if(state!=='playing'||e.target?.isContentEditable||['INPUT','TEXTAREA','SELECT'].includes(e.target?.tagName))return;if(['ArrowLeft','a','A'].includes(e.key)){keys.left=true;e.preventDefault()}if(['ArrowRight','d','D'].includes(e.key)){keys.right=true;e.preventDefault()}});addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))keys.left=false;if(['ArrowRight','d','D'].includes(e.key))keys.right=false});addEventListener('blur',()=>keys={});function move(e){if(state!=='playing')return;let r=c.getBoundingClientRect();player=Math.max(40,Math.min(360,(e.clientX-r.left)*400/r.width));draw()}for(const asset of [bg,shoe,germ,...sprites])asset.addEventListener('load',()=>{if(state!=='playing')draw()});c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);move(e)});c.addEventListener('pointermove',e=>{if(c.hasPointerCapture(e.pointerId))move(e)});draw();
</script></body></html>
