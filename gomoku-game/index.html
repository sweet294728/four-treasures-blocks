t y=Math.max(0,r-2);y<=Math.min(N-1,r+2);y++)for(let x=Math.max(0,c-2);x<=Math.min(N-1,c+2);x++)if(board[y][x])near=true;if(!near)continue;let attack=score(r,c,computer),defense=score(r,c,human);candidates.push({r,c,value:attack>=1000000?2000000:defense>=1000000?1500000:attack+defense*.95+Math.random()*5})}candidates.sort((a,b)=>b.value-a.value);let best=candidates[0]||{r:7,c:7};if(difficulty.value==='easy'&&candidates.length>1){const win=candidates.find(p=>score(p.r,p.c,computer)>=1000000);if(win)best=win;else if(best.value>=1500000&&Math.random()<.65)best=candidates.find(p=>score(p.r,p.c,human)>=1000000)||best;else {let pool=candidates.slice(0,Math.min(8,candidates.length));best=pool[Math.floor(Math.random()*pool.length)]}}place(best.r,best.c)}function position(e){let rect=canvas.getBoundingClientRect();return {c:Math.round(((e.clientX-rect.left)/rect.width*size-pad)/step),r:Math.round(((e.clientY-rect.top)/rect.height*size-pad)/step)}}canvas.addEventListener('pointermove',e=>{let p=position(e);hover=p.r>=0&&p.r<N&&p.c>=0&&p.c<N?p:null});canvas.addEventListener('pointerleave',()=>hover=null);canvas.addEventListener('touchend',e=>e.preventDefault(),{passive:false});canvas.addEventListener('dblclick',e=>e.preventDefault());canvas.addEventListener('pointerdown',e=>{e.preventDefault();if(over||timer||!modal.hidden||mode.value==='ai'&&turn!==player)return;let {r,c}=position(e);if(r<0||r>=N||c<0||c>=N||board[r][c])return;if(selected&&selected.r===r&&selected.c===c){place(r,c)}else{selected={r,c};tone(520,.035)}});function newGame(){reset();if(mode.value==='ai'&&player===2)timer=setTimeout(ai,360)}document.querySelector('#restart').onclick=newGame;document.querySelector('#settings').onclick=()=>{clearTimeout(timer);timer=null;modal.hidden=false};function setupChoices(id,onChange){let group=document.querySelector(id);group.addEventListener('click',e=>{let button=e.target.closest('button[data-value]');if(!button)return;group.querySelectorAll('button').forEach(b=>{b.classLi
