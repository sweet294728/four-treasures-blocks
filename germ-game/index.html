<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f1df"><title>小氣球打細菌</title><link rel="stylesheet" href="style.css?v=3"></head>
<body><main class="app"><img class="decor bubbles left" src="assets/pixel/bubbles/animation.gif" alt=""><img class="decor bubbles right" src="assets/pixel/bubbles/animation.gif" alt=""><img class="decor gauge" src="assets/pixel/gauge/animation.gif" alt=""><header><span class="brand">D K E C　✦　PLAY TIME</span><button id="pause" class="pause-button" hidden aria-label="暫停遊戲">Ⅱ 暫停</button><button id="sound" class="sound" aria-label="關閉音效" aria-pressed="true">♪ 音效開</button></header><section class="intro"><img class="shoe" src="assets/pixel/shoe.png" alt="白藍色呼吸空氣鞋像素插圖"><p class="eyebrow">準備好考驗你的反應力了嗎？</p><h1><img class="title-art" src="assets/pixel/title.png" alt="小氣球打細菌"></h1><p>細菌入侵！和小氣球一起守護空氣工廠。</p></section><section class="game-card"><div class="topline"><div><small>剩餘時間</small><strong id="time">30 <em>秒</em></strong></div><div class="score"><small>目前得分</small><strong id="score">0 <em>分</em></strong></div><div><small>最高紀錄</small><strong id="best">0 <em>分</em></strong></div></div><div class="progress"><div id="bar"></div></div><div class="board-wrap"><div class="board" id="board" aria-label="遊戲區"></div></div><div class="bottom"><span id="message" aria-live="polite">看清楚再出手，小氣球不能打！</span><button id="restart">重新開始 ↻</button></div></section><footer>和呼吸小氣球一起，開心玩一回。 <span>✦</span></footer><div id="pause-overlay" class="overlay hidden"><div class="modal pause-modal"><h2 id="pause-title">遊戲暫停</h2><div id="pause-menu"><button id="resume" class="start">繼續遊戲</button><button id="pause-restart" class="secondary">重新開始</button><button id="pause-difficulty" class="secondary">選擇難度</button><button id="pause-ranking" class="secondary">查看排行榜</button></div><div id="pause-modes" hidden><p>選擇難度後開始新的一局</p><div class="modes"><button class="pause-mode mode" data-value="3">3 × 3 <small>輕鬆玩</small></button><button class="pause-mode mode" data-value="5">5 × 5 <small>反應挑戰</small></button></div><button id="difficulty-back" class="secondary">返回暫停選單</button></div><div id="ranks" hidden><div class="rank-tabs" role="group" aria-label="排行榜難度"><button type="button" data-rank="3">3 × 3</button><button type="button" data-rank="5">5 × 5</button><button type="button" data-rank="legacy">舊紀錄</button></div><p id="rank-status" role="status">讀取中…</p><div id="rank-list" class="rank-list"></div><button id="rank-back" class="secondary">返回</button></div></div></div><div id="overlay" class="overlay"><div class="modal"><span class="badge">LET'S PLAY!</span><h2 id="modal-title">準備開打！</h2><p id="modal-text">打細菌得 10 分，遇到小氣球要手下留情喔！</p><div id="result" class="result" hidden aria-live="polite"><span>本次得分</span><strong id="result-score">0</strong><small>分</small></div><div class="legend"><span><img class="legend-icon" src="assets/pixel/germ/idle-1.png" alt="">打細菌 <b>+10</b></span><span><img class="legend-icon" src="assets/pixel/d/idle-1.png" alt="">小氣球 <b>−10</b></span></div><p class="choose">選擇挑戰難度</p><div class="modes"><button data-mode="3" class="mode active">3 × 3 <small>輕鬆玩</small></button><button data-mode="5" class="mode">5 × 5 <small>反應挑戰</small></button></div><div id="rank-result" hidden><form id="rank-form"><label for="rank-name">輸入暱稱登錄排行榜</label><div class="rank-entry"><input id="rank-name" maxlength="24" placeholder="暱稱（最多 12 字）" autocomplete="nickname"><button id="rank-submit" type="submit">登錄</button></div><p id="rank-message" role="status"></p></form><a class="wheel" href="https://www.dk-shoes.com.tw/v2/GameModule/40931/gpc001/2026070241306" target="_blank" rel="noopener noreferrer">玩輪盤領好康 ↗</a></div><button id="start" class="start">開始遊戲 <span>→</span></button><button id="open-ranks" class="secondary" type="button">查看排行榜</button></div></div></main><script src="leaderboard.js?v=3"></script><script src="game.js?v=3"></script></body></html>
