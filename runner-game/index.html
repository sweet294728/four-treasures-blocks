<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>小氣球鞋盒跑酷</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#26334a;font-family:system-ui,'Microsoft JhengHei',sans-serif;touch-action:manipulation}#game{display:block;width:100vw;height:100vh;touch-action:none}#rotate{display:none;position:fixed;inset:0;background:#24324c;color:white;align-items:center;justify-content:center;text-align:center;padding:2rem;z-index:4;font-weight:800;font-size:clamp(22px,5vw,36px)}#rotate span{display:block;font-size:56px;margin-bottom:18px}@media (orientation:portrait){#rotate{display:flex}}#hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);color:#536477;font-size:13px;white-space:nowrap;pointer-events:none}
#overlay-ui{position:fixed;left:0;top:0;width:960px;height:540px;transform-origin:0 0;pointer-events:none}#overlay-ui .rank-controls,#overlay-ui .rank-list{position:absolute;display:none;pointer-events:auto;text-align:center;font-family:system-ui,Microsoft JhengHei,sans-serif;color:#702924}#overlay-ui .rank-controls{left:270px;top:220px;width:420px}#overlay-ui input,#overlay-ui button,#overlay-ui a{font:700 17px system-ui,Microsoft JhengHei,sans-serif}#overlay-ui input{width:220px;height:42px;padding:6px 10px;border:3px solid #9a5140;background:#fff8e9;color:#702924}#overlay-ui button,#overlay-ui a{display:inline-block;margin:4px;padding:8px 11px;border:3px solid #8a3e32;background:#ffd79e;color:#702924;text-decoration:none;cursor:pointer}#overlay-ui button:disabled{opacity:.55;cursor:default}#rank-status{font-size:14px;margin:3px;min-height:20px}#overlay-ui .rank-list{left:285px;top:168px;width:390px;height:145px;overflow:auto}#rank-list{list-style:none;margin:0;padding:0}#rank-list li{display:flex;justify-content:space-between;padding:3px 20px;border-bottom:1px solid #e2ad86;font-size:16px}#rank-empty{font-size:17px}</style></head><body><canvas id="game"></canvas><div id="hint">點擊畫面、按空白鍵或 ↑ 跳躍</div><div id="rotate"><div><span>↻</span>請將手機轉成橫向<br><small>橫向才能開始遊戲</small></div></div><div id="overlay-ui"><div id="rank-controls" class="rank-controls"><input id="rank-name" maxlength="12" placeholder="輸入暱稱" aria-label="暱稱"><button id="submit-score">登錄成績</button><p id="rank-status" aria-live="polite"></p><div><button id="result-ranking">排行榜</button><button id="play-again">再玩一次</button><a href="https://www.dk-shoes.com.tw/v2/GameModule/40931/gpc001/2026070241306" target="_blank" rel="noopener noreferrer">玩輪盤領好康</a></div></div><div id="rank-view" class="rank-list"><p id="rank-empty"></p><ol id="rank-list"></ol></div></div><script>
'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
const W=960,H=540,G=425, gravity=2700,normalJump=-703,shoeJump=-906;
let golden=false,rankOrigin='pause',state='start',last=0,world=0,score=0,best=0,shoe=0,inv=0,lives=3,spawn=1060,pickupAt=6500,heartAt=1000,boxes=[],items=[],germs=[],hearts=[],speed=285;
try{best=Number(localStorage.getItem('balloonRunnerBest'))||0}catch(e){}
const p={x:180,y:G-62,w:50,h:62,vy:0,ground:true};
let chosen='d';const sprites={};for(const key of ['d','k','e','c']){sprites[key]=new Image();sprites[key].src='復古鞋店街素材/使用者指定角色/'+key.toUpperCase()+'/run/run-1.png'}const shoeImage=new Image();shoeImage.src='assets/shoe-red.png';const logos={};for(const key of ['dk','air','dr-kao','floral-texture']){logos[key]=new Image();logos[key].src='assets/'+key+'.png'}
const artRoot='復古鞋店街素材/';const layers={};for(const [key,file] of Object.entries({sky:'01-sky.png',clouds:'02-clouds.png',far:'03-far-buildings.png',near:'04-near-shops.png',ground:'05-ground.png'})){layers[key]=new Image();layers[key].src=artRoot+'場景分層/'+file}const animations={};for(const ch of ['d','k','e','c']){animations[ch]={};for(const action of ['run','jump','shoe_run','shoe_jump']){animations[ch][action]=Array.from({length:4},(_,i)=>{let img=new Image();if(action==='run'||action==='jump'){img.src=artRoot+'使用者指定角色/'+ch.toUpperCase()+'/'+(action==='run'?'run-side':action)+'/'+action+'-'+(i+1)+'.png';return img}img.src=artRoot+(ch==='c'?'角色動作/C/':'使用者指定角色/'+ch.toUpperCase()+'/')+action+'/'+action+'-'+(i+1)+'.png';return img})}}const uiAssets={};for(const k of ['box','panel','pause']){uiAssets[k]=new Image();uiAssets[k].src=artRoot+'遊戲介面/'+k+'.png'}function drawUi(k,x,y,w,h){const img=uiAssets[k];if(img.complete&&img.naturalWidth){ctx.save();ctx.imageSmoothingEnabled=false;ctx.drawImage(img,x,y,w,h);ctx.restore();return true}return false}const heartFrames=[1,2].map(n=>{const i=new Image();i.src=artRoot+'遊戲介面/愛心/heart-'+n+'.png';return i});function drawHeart(x,y,size,empty=false){const img=heartFrames[Math.floor(performance.now()/350)%2];if(img.complete&&img.naturalWidth){ctx.save();ctx.imageSmoothingEnabled=false;if(empty)ctx.globalAlpha=.22;ctx.drawImage(img,x,y,size,size);ctx.restore()}else{ctx.fillStyle=empty?'#bdaca3':'#c52735';ctx.font='bold '+size+'px system-ui';ctx.fillText('♥',x,y+size*.8)}}const germSprite=new Image();germSprite.src='assets/germ.png';
function tileLayer(img,factor,y,w,h,source){if(!img.complete||!img.naturalWidth)return;const offset=((world*factor)%w+w)%w;ctx.save();ctx.imageSmoothingEnabled=false;for(let x=-offset;x<W;x+=w){if(source)ctx.drawImage(img,0,source[0],img.naturalWidth,source[1],x,y,w,h);else ctx.drawImage(img,x,y,w,h)}ctx.restore()}
function drawPlayer(){const action=shoe?(p.ground?'shoe_run':'shoe_jump'):(p.ground?'run':'jump');const index=p.ground?Math.floor(score*.9)%4:p.vy< -120?1:p.vy<160?2:3;const img=animations[chosen][action][index];if(img.complete&&img.naturalWidth){const size=shoe?120:80;ctx.save();if(inv>0&&Math.floor(inv*12)%2===0)ctx.globalAlpha=.38;ctx.imageSmoothingEnabled=false;ctx.drawImage(img,p.x+p.w/2-size/2,p.y+p.h-size*.925,size,size);ctx.restore()}else{balloon(p.x,p.y-4,shoe>0);if(shoe)shoeArt(p.x-12,p.y+32,.9)}}
function reset(){golden=RunnerRanks.consumeGolden();RunnerRanks.reset();world=0;score=0;shoe=0;inv=0;lives=3;spawn=1060;pickupAt=6500;heartAt=1000;boxes=[];items=[];germs=[];hearts=[];speed=285;p.y=G-p.h;p.vy=0;p.ground=true;state='play'}
function roundRect(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function addJump(){if(innerHeight>innerWidth)return;if(state==='intro'){reset();return}if(state==='play'&&p.ground){p.vy=shoe?shoeJump:normalJump;p.ground=false}}
function inBox(x,y,b){return x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h}
const menuButtons=[{x:280,y:200,w:190,h:60,label:'繼續',act:'resume'},{x:490,y:200,w:190,h:60,label:'重新開始',act:'restart'},{x:280,y:278,w:190,h:60,label:'切換角色',act:'characters'},{x:490,y:278,w:190,h:60,label:'排行榜',act:'leaderboard'}];
canvas.addEventListener('pointerdown',e=>{e.preventDefault();const scale=Math.min(innerWidth/W,innerHeight/H),x=(e.clientX-(innerWidth-W*scale)/2)/scale,y=(e.clientY-(innerHeight-H*scale)/2)/scale;
if(state==='start'||state==='characters'){if(y>=220&&y<=315&&x>=275&&x<675){chosen=['d','k','e','c'][Math.min(3,Math.floor((x-275)/100))];return}if(inBox(x,y,{x:365,y:332,w:230,h:55})){if(state==='start')state='intro';else state='pause';return}return}
if(state==='intro'){if(inBox(x,y,{x:365,y:350,w:230,h:55}))reset();return}if(state==='leaderboard'){if(inBox(x,y,{x:365,y:332,w:230,h:55})){state=rankOrigin;RunnerRanks.hide();}return}
if(state==='pause'){for(const b of menuButtons)if(inBox(x,y,b)){if(b.act==='resume')state='play';else if(b.act==='restart')reset();else if(b.act==='leaderboard'){rankOrigin='pause';state='leaderboard';RunnerRanks.load()}else state=b.act;return}return}
if(state==='over')return;
if(state==='play'&&x>=845&&x<=940&&y>=10&&y<=75){state='pause';return}addJump()});window.addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!e.repeat)addJump()}if(e.code==='KeyP'){if(state==='play')state='pause';else if(state==='pause')state='play'}});
function milestoneWorld(m){const t=m/(golden?50:10),capWorld=(480-285)/.006,capTime=Math.log(480/285)/.006;return t<=capTime?285/.006*(Math.exp(.006*t)-1):capWorld+480*(t-capTime)}
function gap(){return 230+Math.random()*260} function makeGroup(){const x=spawn;const milestoneX=milestoneWorld(heartAt)+p.x+p.w/2;if(x+650>=milestoneX){hearts.push({x:milestoneX-20,y:G-50,meters:heartAt});spawn=milestoneX+40+gap();heartAt+=1000;return}if(x>=pickupAt){items.push({x:x,y:G-55});pickupAt=x+10000+Math.random()*4000;spawn=x+55+gap();return}if(Math.random()<.4){germs.push({x:x,y:G-44,w:44,h:44});spawn=x+44+gap();return}const patterns=[[1],[1,1],[1,1,1],[1,1,2],[1,1,2,2],[1,1,2,1],[1,1,1,2]];const levels=patterns[Math.floor(Math.random()*patterns.length)];for(let i=0;i<levels.length;i++){for(let j=0;j<levels[i];j++)boxes.push({x:x+i*93,y:G-(j+1)*58,w:93,h:58,style:Math.floor(Math.random()*3)})}spawn=x+levels.length*93+gap()}
function knock(o){o.hit=true;o.vx=speed+180+Math.random()*100;o.vy=-350-Math.random()*100;o.spin=(Math.random()-.5)*7;o.angle=0;o.life=2}
function endGame(){if(inv>0)return;lives--;if(lives>0){inv=1.5;p.vy=-350;p.ground=false;return}state='over';RunnerRanks.onFinish(golden);best=Math.max(best,Math.floor(score));try{localStorage.setItem('balloonRunnerBest',best)}catch(e){}}
function update(dt){if(state!=='play'||innerHeight>innerWidth)return;speed=Math.min(480,285+world*.006);world+=speed*dt;score+=dt*(golden?50:10);if(shoe>0){shoe-=dt;if(shoe<=0){shoe=0;inv=1;p.vy=-260;p.ground=false}}else inv=Math.max(0,inv-dt);
while(world+W+100>spawn)makeGroup();
const prevBottom=p.y+p.h;p.vy+=gravity*dt;p.y+=p.vy*dt;p.ground=false;if(p.y+p.h>=G){p.y=G-p.h;p.vy=0;p.ground=true}
for(const b of boxes){if(b.hit)continue;let bx=b.x-world;if(p.x+p.w>bx+3&&p.x<bx+b.w-3&&p.y+p.h>b.y&&p.y<b.y+b.h){if(shoe>0)knock(b);else if(p.vy>=0&&prevBottom<=b.y+8){p.y=b.y-p.h;p.vy=0;p.ground=true}else if(inv<=0)endGame()}}
for(const g of germs){if(g.hit)continue;let x=g.x-world;if(p.x+p.w>x+3&&p.x<x+g.w-3&&p.y+p.h>g.y+3&&p.y<g.y+g.h-3){if(shoe>0)knock(g);else if(inv<=0)endGame()}}
for(const a of items){let x=a.x-world;if(p.x+p.w>x-18&&p.x<x+42&&p.y+p.h>a.y-20&&p.y<a.y+35){a.dead=true;shoe=5;inv=0}}
for(const h of hearts){let x=h.x-world;if(p.x+p.w>x-5&&p.x<x+40&&p.y+p.h>h.y-5&&p.y<h.y+40){h.dead=true;lives=Math.min(3,lives+1)}}
for(const o of [...boxes,...germs])if(o.hit){o.x+=o.vx*dt;o.y+=o.vy*dt;o.vy+=900*dt;o.angle+=o.spin*dt;o.life-=dt}
boxes=boxes.filter(b=>b.hit?b.life>0:b.x-world>-110);germs=germs.filter(g=>g.hit?g.life>0:g.x-world>-60);items=items.filter(a=>!a.dead&&a.x-world>-100);hearts=hearts.filter(h=>!h.dead&&h.x-world>-100)}

function balloon(x,y,driving){if(sprites[chosen].complete&&sprites[chosen].naturalWidth){ctx.save();if(inv>0&&Math.floor(inv*12)%2===0)ctx.globalAlpha=.38;ctx.imageSmoothingEnabled=false;ctx.drawImage(sprites[chosen],x-8,y-5,66,66);ctx.restore();return}ctx.save();ctx.translate(x,y);if(inv>0&&Math.floor(inv*12)%2===0)ctx.globalAlpha=.38;ctx.fillStyle='#ee7690';ctx.beginPath();ctx.ellipse(25,25,21,25,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff1e9';ctx.beginPath();ctx.ellipse(25,29,15,14,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#433f50';ctx.fillRect(17,25,3,4);ctx.fillRect(30,25,3,4);ctx.beginPath();ctx.arc(25,31,3,0,Math.PI);ctx.strokeStyle='#433f50';ctx.lineWidth=2;ctx.stroke();if(!driving){ctx.strokeStyle='#714d5d';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(18,49);ctx.lineTo(14,60);ctx.moveTo(32,49);ctx.lineTo(36,60);ctx.stroke()}ctx.restore()}
function shoeArt(x,y,scale=1){if(shoeImage.complete&&shoeImage.naturalWidth){ctx.save();ctx.imageSmoothingEnabled=false;ctx.drawImage(shoeImage,x,y,80*scale,43*scale);ctx.restore();return}ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.fillStyle='#f47e83';ctx.beginPath();ctx.moveTo(0,25);ctx.lineTo(10,4);ctx.lineTo(36,8);ctx.lineTo(43,20);ctx.lineTo(72,25);ctx.quadraticCurveTo(81,28,80,39);ctx.lineTo(0,39);ctx.closePath();ctx.fill();roundRect(0,35,80,8,4,'#fff5dd');ctx.strokeStyle='#fff5dd';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(20,15);ctx.lineTo(37,18);ctx.moveTo(18,21);ctx.lineTo(39,24);ctx.stroke();ctx.restore()}
function pixelPanel(x,y,w,h,active=false){ctx.fillStyle='#66302a';ctx.fillRect(x+8,y,w-16,h);ctx.fillRect(x,y+8,w,h-16);ctx.fillStyle=active?'#e7a04e':'#d68b68';ctx.fillRect(x+7,y+7,w-14,h-14);ctx.fillStyle=active?'#ffe2a1':'#ffe2bc';ctx.fillRect(x+11,y+11,w-22,h-22);ctx.fillStyle='#fff2d3';ctx.fillRect(x+16,y+14,w-32,4)}
function pixelButton(b){pixelPanel(b.x,b.y,b.w,b.h);ctx.textAlign='center';ctx.fillStyle='#812d27';ctx.font='bold 19px system-ui';ctx.fillText(b.label,b.x+b.w/2,b.y+b.h/2+7)}
function render(){let dpr=Math.min(devicePixelRatio||1,2), cw=innerWidth,ch=innerHeight;if(canvas.width!==Math.round(cw*dpr)||canvas.height!==Math.round(ch*dpr)){canvas.width=Math.round(cw*dpr);canvas.height=Math.round(ch*dpr)}let s=Math.min(cw/W,ch/H),ox=(cw-W*s)/2,oy=(ch-H*s)/2;const overlay=document.querySelector('#overlay-ui');overlay.style.transform='translate('+ox+'px,'+oy+'px) scale('+s+')';document.querySelector('#rank-controls').style.display=state==='over'?'block':'none';document.querySelector('#rank-view').style.display=state==='leaderboard'?'block':'none';ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#dceef2';ctx.fillRect(0,0,cw,ch);ctx.setTransform(dpr*s,0,0,dpr*s,dpr*ox,dpr*oy);
ctx.fillStyle='#edb4bc';ctx.fillRect(0,0,W,H);if(layers.sky.complete&&layers.sky.naturalWidth)ctx.drawImage(layers.sky,0,0,W,H);tileLayer(layers.clouds,.08,-125,1440,480);tileLayer(layers.far,.22,10,1260,420);tileLayer(layers.near,.47,35,990,330);const lane=ctx.createLinearGradient(0,295,0,385);lane.addColorStop(0,'rgba(231,167,156,0)');lane.addColorStop(.55,'rgba(231,167,156,.88)');lane.addColorStop(1,'#e7a798');ctx.fillStyle=lane;ctx.fillRect(0,295,W,G-295);ctx.fillStyle='#d58c78';ctx.fillRect(0,G,W,H-G);tileLayer(layers.ground,1,G,960,115,[270,260]);
for(const b of boxes){let x=b.x-world;ctx.save();if(b.hit){ctx.translate(x+b.w/2,b.y+b.h/2);ctx.rotate(b.angle);ctx.translate(-b.w/2,-b.h/2);x=0}let y=b.hit?0:b.y;if(!drawUi('box',x,y,b.w,b.h))roundRect(x+2,y,b.w-4,b.h,3,'#e4c348');ctx.restore()}
for(const g of germs){let x=g.x-world;ctx.save();ctx.translate(x+22,g.y+22);if(g.hit)ctx.rotate(g.angle);if(germSprite.complete&&germSprite.naturalWidth){ctx.imageSmoothingEnabled=false;ctx.drawImage(germSprite,-30,-30,60,60)}else{ctx.fillStyle='#82ba79';ctx.beginPath();ctx.arc(0,0,20,0,Math.PI*2);ctx.fill()}ctx.restore()}
for(const h of hearts){let x=h.x-world;drawHeart(x-3,h.y-4,48);ctx.save();ctx.fillStyle='#793b35';ctx.font='bold 15px system-ui';ctx.textAlign='center';ctx.fillText(h.meters+' m',x+20,h.y-13);ctx.restore()}
for(const a of items){let x=a.x-world;ctx.fillStyle='#ffe796';ctx.beginPath();ctx.arc(x+20,a.y+12,35,0,7);ctx.fill();shoeArt(x-6,a.y-5,.7)}

drawPlayer();if(shoe){roundRect(p.x-8,p.y+p.h+9,70,25,10,'#f47e83');ctx.fillStyle='white';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText(Math.ceil(shoe)+' 秒',p.x+27,p.y+p.h+27);ctx.textAlign='left'}
if(state==='play'||state==='pause'){if(!drawUi('pause',862,12,60,60)){roundRect(845,16,95,54,16,'rgba(255,255,255,.88)');ctx.fillStyle='#48566a';ctx.font='bold 18px system-ui';ctx.textAlign='center';ctx.fillText('暫停',892,50);ctx.textAlign='left'}}
if(!drawUi('panel',14,12,226,68))roundRect(14,12,226,68,12,'#ffe1bb');if(!drawUi('panel',246,12,226,68))roundRect(246,12,226,68,12,'#ffe1bb');ctx.fillStyle='#7e2725';ctx.font='bold 22px system-ui';ctx.textAlign='center';ctx.fillText(Math.floor(score)+' m',127,56);ctx.textAlign='left';for(let i=0;i<3;i++)drawHeart(268+i*53,22,47,i>=lives);
if(state!=='play'){ctx.fillStyle='rgba(45,24,29,.52)';ctx.fillRect(0,0,W,H);pixelPanel(225,92,510,340);ctx.fillStyle='#782725';ctx.textAlign='center';ctx.font='bold 32px system-ui';const titles={start:'小氣球鞋盒跑酷',intro:'遊戲玩法',over:'挑戰結束！',pause:'暫停中',characters:'切換角色',leaderboard:'排行榜'};ctx.fillText(titles[state]||'',480,151);
if(state==='start'||state==='characters'){ctx.font='bold 18px system-ui';ctx.fillText('選擇你的角色',480,194);for(let i=0;i<4;i++){let key=['d','k','e','c'][i],x=280+i*100;pixelPanel(x,218,86,96,key===chosen);if(sprites[key].complete&&sprites[key].naturalWidth){ctx.imageSmoothingEnabled=false;ctx.drawImage(sprites[key],x+14,229,58,58)}ctx.fillStyle='#782725';ctx.font='bold 16px system-ui';ctx.fillText(key.toUpperCase()+'寶',x+43,304)}pixelButton({x:365,y:332,w:230,h:55,label:state==='start'?'開始遊戲':'返回暫停選單'});}
else if(state==='intro'){ctx.textAlign='left';ctx.font='bold 17px system-ui';const rows=[['box','鞋盒可以踩，跳不上或撞到會扣愛心'],['germ','細菌不能踩，要跳過去'],['shoe','鞋子衝刺 5 秒，可跳躍並撞開障礙'],['heart','每 1000 m 有愛心，最多 3 顆']];for(let i=0;i<rows.length;i++){let y=170+i*42,k=rows[i][0];if(k==='box')drawUi('box',258,y,42,30);else if(k==='germ'&&germSprite.complete)ctx.drawImage(germSprite,260,y-2,34,34);else if(k==='shoe')shoeArt(257,y,0.42);else if(k==='heart')drawHeart(257,y-4,39);ctx.fillStyle='#782725';ctx.fillText(rows[i][1],315,y+22)}ctx.textAlign='center';ctx.font='bold 14px system-ui';ctx.fillText('點擊畫面或按空白鍵跳躍',480,344);pixelButton({x:365,y:350,w:230,h:55,label:'開始跑酷'})}else if(state==='pause'){for(const b of menuButtons)pixelButton(b)}else if(state==='leaderboard'){pixelButton({x:365,y:332,w:230,h:55,label:'返回'})}else if(state==='over'){ctx.font='bold 23px system-ui';ctx.fillText('本次距離  '+Math.floor(score)+' m',480,197)}ctx.textAlign='left'}}
function frame(t){let dt=Math.min((t-last)/1000||0,.035);last=t;update(dt);render();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script><script src="leaderboard.js"></script></body></html>
