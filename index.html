<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>四寶方塊｜呼吸小氣球</title><link rel="stylesheet" href="style.css"></head><body>
<main class="shell"><div class="game-layout"><div class="toolbar"><button id="sound" aria-pressed="true" aria-label="音效開啟">♪ 音效</button><button id="music" aria-pressed="true" aria-label="音樂開啟">♫ 音樂</button><button id="help">遊戲說明</button><button id="ranking">排行榜</button><button id="pause">Ⅱ 暫停</button><button id="restart">↻ 重新開始</button></div><div class="scorebar"><div><small>分數</small><strong id="score">0</strong></div><div><small>消除</small><strong id="lines">0</strong></div><div><small>等級</small><strong id="level">1</strong></div><div><small>模式</small><strong id="mode-display">挑戰</strong></div><div class="next"><small>下一個</small><canvas id="next" width="120" height="100" aria-label="下一個方塊"></canvas></div></div><div class="board-wrap"><div class="board-area"><canvas id="board" width="300" height="600" aria-label="遊戲棋盤"></canvas><div id="board-timer" class="board-timer" hidden aria-label="剩餘時間"><span>剩餘</span><strong id="time">120</strong><span>秒</span></div><div id="feedback" class="feedback" aria-hidden="true"></div><div class="overlay" id="overlay"><div class="overlay-card"><div class="team" aria-label="四寶集合"><img src="character-d.png" alt="D寶"><img src="character-k.png" alt="K寶"><img src="character-e.png" alt="E寶"><img src="character-c.png" alt="C寶"></div><h2 id="overlay-title">準備好了嗎？</h2><p id="overlay-text">選擇模式，和四寶一起出發！</p><div id="setup"><fieldset class="mode-options"><legend>選擇遊戲模式</legend><label><input type="radio" name="mode" value="challenge" checked><span><i class="mode-icon" aria-hidden="true">∞</i><b>挑戰模式</b><small>不限時間・挑戰極限</small></span></label><label><input type="radio" name="mode" value="timed"><span><i class="mode-icon" aria-hidden="true">120</i><b>限時模式</b><small>120 秒・拚最高分</small></span></label></fieldset></div><form id="result-form" hidden><label for="nickname">輸入暱稱，登錄本機排行榜</label><div class="result-input"><input id="nickname" maxlength="12" placeholder="輸入暱稱"><button type="submit">登錄</button></div><p id="result-status" role="status"></p></form><button id="start" class="primary">開始遊戲 →</button><p id="start-hint" class="start-hint">點按旋轉・長按直落・拖曳移動</p><button id="menu" class="secondary" hidden>返回選擇模式</button></div></div></div></div><p class="hint">點按旋轉 · 長按直落 · 拖曳移動</p></div></main>
<dialog id="info-dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="close-dialog" aria-label="關閉">✕</button></div><div id="dialog-body"></div></dialog><script src="game.js"></script></body></html>
